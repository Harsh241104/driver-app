<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101c2b">
    <meta name="description" content="Sign in to your last-mile driver account.">
    <title>Driver sign in | Raipur Driver Console</title>
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="/index.html">RAIPUR<span>DRIVER CONSOLE</span></a>
      <section class="auth-card" aria-labelledby="page-title">
        <p class="eyebrow">DRIVER ACCOUNT</p>
        <h1 id="page-title">Welcome back.</h1>
        <p class="intro">Sign in to see your delivery earnings and account.</p>
        <form id="login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p id="form-message" class="form-message" role="alert" hidden></p>
          <button class="primary-button" type="submit">Sign in</button>
        </form>
        <p class="switch-link">New driver? <a href="/register.html">Create an account</a></p>
      </section>
      <a class="back-link" href="/index.html">Open the offline route demo</a>
    </main>
    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
