<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101c2b">
    <meta name="description" content="Create a last-mile driver account.">
    <title>Create driver account | Raipur Driver Console</title>
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="/index.html">RAIPUR<span>DRIVER CONSOLE</span></a>
      <section class="auth-card" aria-labelledby="page-title">
        <p class="eyebrow">DRIVER ACCOUNT</p>
        <h1 id="page-title">Join the team.</h1>
        <p class="intro">Create your account to manage deliveries and earnings.</p>
        <form id="register-form">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" minlength="2" maxlength="120" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="phone">Phone <span class="optional">(optional, international format)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+919876543210" pattern="\+[1-9][0-9]{7,14}">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <p id="form-message" class="form-message" role="alert" hidden></p>
          <button class="primary-button" type="submit">Create account</button>
        </form>
        <p class="switch-link">Already registered? <a href="/login.html">Sign in</a></p>
      </section>
      <a class="back-link" href="/index.html">Open the offline route demo</a>
    </main>
    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
